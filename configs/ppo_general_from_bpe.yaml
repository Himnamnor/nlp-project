# configs/ppo_general_from_bpe.yaml
# Purpose: conservative hand-written PPO from the from-BPE SFT/reward checkpoints.

project:
  name: llama-general-90m-from-bpe-ppo
  seed: 42
  device: cuda
  dtype: bfloat16

paths:
  tokenizer_dir: /root/autodl-tmp/Project/tokenizer_general_from_bpe/
  sft_ckpt: /root/autodl-tmp/checkpoints/sft_general_from_bpe/best.pt
  reward_ckpt: /root/autodl-tmp/checkpoints/reward_general_from_bpe/
  checkpoint_dir: /root/autodl-tmp/checkpoints/ppo_general_from_bpe/
  log_dir: /root/autodl-tmp/Project/logs/ppo_general_from_bpe/

model:
  n_layer: 10
  d_model: 768
  n_heads: 12
  n_kv_heads: 4
  context_length: 1024
  vocab_size: 32768
  tie_word_embeddings: true

data:
  dataset: PKU-Alignment/PKU-SafeRLHF
  split: train
  num_prompts: 2000
  unsafe_ratio: 0.7
  max_prompt_length: 256
  num_workers: 0

ppo:
  batch_size: 8
  mini_batch_size: 2
  ppo_epochs: 2
  learning_rate: 5.0e-6
  weight_decay: 0.0
  init_kl_coef: 0.3
  target_kl: 1.0
  kl_horizon: 10000
  cliprange: 0.2
  cliprange_value: 0.2
  vf_coef: 0.5
  entropy_coef: 0.0
  grad_clip: 1.0
  gamma: 1.0
  lam: 0.95
  max_new_tokens: 64
  temperature: 0.8
  top_p: 0.9
  total_steps: 150
  log_interval: 1
  save_interval: 50

logging:
  use_wandb: false
  wandb_project: nlp-llm-project
