# configs/dpo.yaml
# 用途：DPO 对照实验（advanced/，无需奖励模型）

project:
  name: llama-mini-dpo
  seed: 42
  device: cuda
  dtype: bfloat16

paths:
  tokenizer_dir: tokenizer/
  sft_ckpt: checkpoints/sft/best.pt
  checkpoint_dir: checkpoints/dpo/
  log_dir: logs/dpo/

model:
  n_layer: 6
  d_model: 512
  n_heads: 8
  n_kv_heads: 4
  context_length: 1024
  vocab_size: 16384

data:
  dataset: PKU-Alignment/PKU-SafeRLHF
  max_length: 1024
  val_ratio: 0.05

lora:
  r: 8
  lora_alpha: 16
  target_modules:
    - q_proj
    - v_proj

dpo:
  beta: 0.1
  num_epochs: 1
  batch_size: 4
  learning_rate: 5.0e-6
  max_prompt_length: 512
  max_length: 1024

logging:
  use_wandb: true
  wandb_project: nlp-llm-project
