# configs/dpo_general.yaml
# 用途：泛化模型的 DPO 对照实验

project:
  name: llama-general-90m-dpo
  seed: 42
  device: cuda
  dtype: bfloat16

paths:
  tokenizer_dir: tokenizer_general/
  sft_ckpt: checkpoints/sft_general_full/best.pt
  checkpoint_dir: checkpoints/dpo_general/
  log_dir: logs/dpo_general/

model:
  n_layer: 10
  d_model: 768
  n_heads: 12
  n_kv_heads: 4
  context_length: 1024
  vocab_size: 32768
  tie_word_embeddings: true

data:
  dataset: PKU-Alignment/PKU-SafeRLHF
  split: train
  max_samples: 50000
  max_length: 512
  val_ratio: 0.05
  num_workers: 4

dpo:
  beta: 0.1

train:
  num_epochs: 1
  batch_size: 4
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.03
  grad_clip: 1.0
  log_interval: 20
  eval_interval: 200
  save_interval: 500
  max_steps: null

logging:
  use_wandb: false
  wandb_project: nlp-llm-project
